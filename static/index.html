<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Motivo AI — Test UI</title>
    <style>
      body { font-family: system-ui, Arial; max-width: 760px; margin: 32px auto; padding: 0 16px; }
      h1 { font-size: 1.4rem; }
      textarea { width:100%; height:100px; padding:8px; font-size:14px }
      input[type=text] { width:100%; padding:8px; font-size:14px }
      button { padding:10px 14px; font-size:14px; margin-top:8px }
      .card { border:1px solid #eee; padding:12px; border-radius:8px; margin-top:12px }
      .log { white-space:pre-wrap; font-family:monospace; font-size:13px }
    </style>
  </head>
  <body>
    <h1>🤖 Motivo AI — Test UI</h1>
    <p>Test the A2A motivation API endpoint. Enter your message and click Send to test the endpoint (A2A mode is enabled by default).</p>

    <label>📝 Your Message</label>
    <textarea id="message">I need a quick motivational boost to finish my project.</textarea>

    <div style="margin-top:12px">
      <button id="send" style="background-color:#4CAF50; color:white; font-weight:bold">📤 Send Request</button>
      <button id="clear" style="background-color:#f44336; color:white">🗑️ Clear Response</button>
    </div>

    <div class="card">
      <strong>Response</strong>
      <div id="response" class="log">(no response yet)</div>
    </div>

    <script>
      const send = document.getElementById('send');
      const clear = document.getElementById('clear');
      const responseEl = document.getElementById('response');

      send.addEventListener('click', async () => {
        responseEl.textContent = 'Waiting for response...';
        const rawMessage = document.getElementById('message').value || '';
        const message = encodeURIComponent(rawMessage);
        const key = document.getElementById('apikey').value.trim();
        const useA2A = document.getElementById('useA2A').checked;

        try {
          if (useA2A) {
            const url = '/a2a/motivation';
            
            // Build proper A2A JSON-RPC 2.0 request
            const body = {
              jsonrpc: "2.0",
              id: "test-" + Math.random().toString(36).substr(2, 9),
              method: "message/send",
              params: {
                message: {
                  role: "user",
                  content: rawMessage
                }
              }
            };

            console.log('Sending A2A request:', body);
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });

            if (!res.ok) {
              const text = await res.text();
              responseEl.textContent = `Error ${res.status}: ${text}`;
              return;
            }

            const data = await res.json();
            responseEl.textContent = JSON.stringify(data, null, 2);
          } else {
            const url = `/motivation?message=${message}`;
            const headers = {};
            if (key) headers['X-API-KEY'] = key;

            const res = await fetch(url, { headers });
            if (!res.ok) {
              const text = await res.text();
              responseEl.textContent = `Error ${res.status}: ${text}`;
              return;
            }

            const data = await res.json();
            responseEl.textContent = JSON.stringify(data, null, 2);
          }
        } catch (err) {
          responseEl.textContent = 'Network error: ' + err;
        }
      });

      clear.addEventListener('click', () => {
        responseEl.textContent = '(no response yet)';
      });
    </script>
  </body>
</html>
